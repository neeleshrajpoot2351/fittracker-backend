services:
  - type: web
    name: fittracker-backend
    env: java
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/fitnessTracker-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: fittracker-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: fittracker-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: fittracker-db
          property: password
      - key: FITNESS_TRACKER_APP_JWT_SECRET
        generateValue: true
      - key: FITNESS_TRACKER_APP_JWT_EXPIRATION_MS
        value: 86400000
      - key: SERVER_PORT
        value: 8080

databases:
  - name: fittracker-db
    databaseName: fitnessTracker
    user: fittracker_user
    plan: free

