spring.application.name=fitnessTracker

# Server port
server.port=${SERVER_PORT:8080}

# Database configuration - will be set by environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.main.allow-circular-references=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.root=INFO

# JWT Configuration
fitnessTracker.app.jwtSecret=${FITNESS_TRACKER_APP_JWT_SECRET}
fitnessTracker.app.jwtExpirationMs=${FITNESS_TRACKER_APP_JWT_EXPIRATION_MS:86400000}

# CORS Configuration
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

